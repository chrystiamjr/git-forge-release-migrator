name: Automated PR Review
run-name: 'PR review #${{ github.event.workflow_run.pull_requests[0].number }}'

on:
  workflow_run:
    workflows: [Quality Checks]
    types: [completed]

concurrency:
  group: auto-pr-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eligibility:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
      number: ${{ steps.guard.outputs.number }}
      head: ${{ steps.guard.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-event.mjs guard

  evidence:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: review-publish-${{ github.repository }}-${{ needs.eligibility.outputs.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      PR_NUMBER: ${{ needs.eligibility.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/review-auth
        id: auth
        with:
          app-id: ${{ secrets.REVIEW_BOT_APP_ID }}
          app-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          bot-token: ${{ secrets.GH_REVIEW_BOT_TOKEN }}
          fallback-token: ${{ secrets.GH_TOKEN }}
      - if: steps.auth.outputs.configured == 'true'
        run: node scripts/review-event.mjs evidence

  analysis:
    needs: [eligibility, evidence]
    if: always() && !cancelled() && needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      PR_NUMBER: ${{ needs.eligibility.outputs.number }}
      REVIEW_EXPECTED_HEAD: ${{ needs.eligibility.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Configure review result path
        run: echo "REVIEW_RESULT_PATH=$RUNNER_TEMP/auto-pr-review.json" >> "$GITHUB_ENV"
      - uses: ./.github/actions/review-auth
        id: auth
        with:
          app-id: ${{ secrets.REVIEW_BOT_APP_ID }}
          app-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          bot-token: ${{ secrets.GH_REVIEW_BOT_TOKEN }}
          fallback-token: ${{ secrets.GH_TOKEN }}
      - name: Recheck live PR before installing AI tools
        id: guard
        if: steps.auth.outputs.configured == 'true'
        run: node scripts/review-event.mjs guard
      - name: Resolve AI review gate
        id: ai
        if: steps.guard.outputs.eligible == 'true'
        env:
          ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$ENABLED" == true && "$ACTOR" == "$OWNER" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code CLI
        if: steps.ai.outputs.enabled == 'true' && (vars.AI_REVIEW_ENGINE == '' || vars.AI_REVIEW_ENGINE == 'claude' || (vars.AI_REVIEW_VERIFICATION_MODE != '' && vars.AI_REVIEW_VERIFICATION_MODE != 'off'))
        run: npm install --global @anthropic-ai/claude-code@2.1.296
      - name: Run automated review analysis
        if: steps.guard.outputs.eligible == 'true'
        env:
          AI_REVIEW_ENABLED: ${{ steps.ai.outputs.enabled }}
          AI_REVIEW_ENGINE: ${{ vars.AI_REVIEW_ENGINE }}
          AI_REVIEW_MAX_ROUNDS: ${{ vars.AI_REVIEW_MAX_ROUNDS }}
          AI_REVIEW_VERIFICATION_MODE: ${{ vars.AI_REVIEW_VERIFICATION_MODE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.ai.outputs.enabled == 'true' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          GEMINI_API_KEY: ${{ steps.ai.outputs.enabled == 'true' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
        run: node scripts/review-pr.mjs
      - name: Ensure a head-bound result after analysis or setup failure
        if: always() && !cancelled() && steps.guard.outputs.eligible == 'true'
        run: node scripts/review-result.mjs
      - name: Retain head-bound analysis result
        if: always() && !cancelled() && steps.guard.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: automated-review-result
          path: ${{ runner.temp }}/auto-pr-review.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: [eligibility, analysis]
    if: always() && !cancelled() && needs.eligibility.outputs.eligible == 'true' && needs.analysis.result != 'cancelled' && needs.analysis.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: review-publish-${{ github.repository }}-${{ needs.eligibility.outputs.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: read
    env:
      PR_NUMBER: ${{ needs.eligibility.outputs.number }}
      REVIEW_EXPECTED_HEAD: ${{ needs.eligibility.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Configure review result path
        run: echo "REVIEW_RESULT_PATH=$RUNNER_TEMP/review-result/auto-pr-review.json" >> "$GITHUB_ENV"
      - uses: ./.github/actions/review-auth
        id: auth
        with:
          app-id: ${{ secrets.REVIEW_BOT_APP_ID }}
          app-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          bot-token: ${{ secrets.GH_REVIEW_BOT_TOKEN }}
          fallback-token: ${{ secrets.GH_TOKEN }}
      - id: guard
        if: steps.auth.outputs.configured == 'true'
        run: node scripts/review-event.mjs guard
      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.eligible == 'true'
        continue-on-error: true
        with:
          name: automated-review-result
          path: ${{ runner.temp }}/review-result
      - name: Publish checklist and review verdict
        if: steps.guard.outputs.eligible == 'true'
        run: node scripts/publish-pr-review.mjs
      - name: Enforce automated verdict
        if: steps.guard.outputs.eligible == 'true'
        run: node scripts/review-event.mjs enforce
