name: Quality Check
description: Run project validation with comparable base coverage and retained evidence
inputs:
  base_sha:
    description: Immutable revision for coverage comparison
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: ./.github/actions/node-setup
    - name: Check translations parity
      shell: bash
      run: node scripts/check-translations.mjs
    - name: Test process and review helpers
      shell: bash
      run: yarn test:process
    - name: Prepare comparable baseline and validate current source
      shell: bash
      env:
        PR_BASE_SHA: ${{ inputs.base_sha }}
        CI: 'true'
      run: |
        if [[ -z "$PR_BASE_SHA" ]]; then
          PR_BASE_SHA="$(git rev-parse HEAD^)"
        fi
        BASE_REPORT="$(node scripts/prepare-validation-baseline.mjs "$PR_BASE_SHA" "$RUNNER_TEMP/gfrm-baseline")"
        yarn verify:ticket --ci-core --ticket LOCAL-ci-validation --base "$PR_BASE_SHA" --baseline-report "$BASE_REPORT" --out "$RUNNER_TEMP/gfrm-validation"
    - name: Upload sanitized validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ticket-validation-report
        path: |
          ${{ runner.temp }}/gfrm-validation/
          ${{ runner.temp }}/gfrm-baseline/setup.log
          ${{ runner.temp }}/gfrm-baseline/reports/
          dart_cli/coverage/lcov.info
          dart_cli/coverage/coverage_html.zip
          gui/coverage/lcov.info
        if-no-files-found: warn
        retention-days: 14
